server {
 listen 8080;
 server_name _;
 location / { return 404; }
 absolute_redirect off;
 location = / { return 302 /tma/profile$is_args$args; }
 location ~ ^/tma(?:/gamedev-achievements)?/?$ { return 302 /tma/profile$is_args$args; }
 location ~ ^/api/tma/gamedev-achievements(/achievements)?$ { return 307 /api/tma/profile$1$is_args$args; }
 location ~ "^/(?:tma/profile/?|tma/assets/[A-Za-z0-9_.-]+|api/tma/profile(?:/(?:achievements|summary))?|api/achievement-icons/[a-f0-9]{64}\.(?:webp|png))$" {
   limit_except GET { deny all; }
   resolver 127.0.0.11 valid=10s ipv6=off;
   set $backend studio:3000;
   proxy_set_header Cookie "";
   proxy_set_header Authorization "";
   proxy_pass http://$backend$uri;
 }
}
