server {
 listen 8080;
 server_name _;
 location / { return 404; }
 location = / { return 302 /tma/gamedev-achievements; }
 location ~ "^/(?:tma/gamedev-achievements/?|tma/assets/[A-Za-z0-9_.-]+|api/tma/gamedev-achievements(?:/achievements)?|api/achievement-icons/[a-f0-9]{64}\.(?:webp|png))$" {
   limit_except GET { deny all; }
   resolver 127.0.0.11 valid=10s ipv6=off;
   set $backend studio:3000;
   proxy_set_header Cookie "";
   proxy_set_header Authorization "";
   proxy_pass http://$backend$uri;
 }
}
